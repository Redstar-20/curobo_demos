##
## Two Franka Panda arms facing each other, modeled as one 14-DoF robot.
## Derived from franka.yml: every link/joint name is prefixed with left_ or right_.
## Because both arms share one kinematic tree, robot self-collision checking also
## keeps the two arms from colliding with each other.
robot_cfg:
  kinematics:
    format_version: 2.0
    urdf_path: robot/franka_description/dual_franka_panda.urdf
    asset_root_path: robot/franka_description
    base_link: base_link
    tool_frames:
    - left_panda_hand
    - right_panda_hand
    grasp_contact_link_names:
    - left_panda_hand
    - left_panda_leftfinger
    - left_panda_rightfinger

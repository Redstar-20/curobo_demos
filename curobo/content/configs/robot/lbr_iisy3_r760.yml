## KUKA LBR iisy3 R760 arm without an end effector. Tool frame: tool0 (flange face, z out of the flange).
## Arm model from https://github.com/kroshu/kuka_robot_descriptions (Apache-2.0).
## Spheres: RobotBuilder.fit_collision_spheres(use_collision_mesh=True, sphere_density=0.25,
##   protrusion_weight=100, base_link clipped at z=0; base_link refit at density 1.0).
##   Fit to collision meshes: the visual meshes are not watertight (link_6 has 115 shells).
## self_collision_ignore: neighbors + pairs touching at the default pose; random never-collide
##   pruning is off because it can drop pairs that do collide in other poses.
## attached_object sits on tool0 and holds objects carried at the flange.
